schema_version: 1

context:
  name: bleak
  version: "3.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/bleak-${{ version }}.tar.gz
  sha256: e37fd30c4691c908d31c8b92ca55b92a22ab924a77c35579822c859042992145

build:
  # Mac Os X is currently not working as - pyobjc-framework-libdispatch is missing on conda-forge
  number: 0
  skip: osx
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python
    - uv-build
  run:
    - if: win
      then: bleak-winrt >=1.1.1
    - if: linux
      then: dbus-fast
    - if: osx
      then:
        - pyobjc-core
        - pyobjc-framework-corebluetooth
        - pyobjc-framework-libdispatch
    - python
    - typing-extensions >=4.2.0
    - async-timeout

tests:
  - python:
      imports:
        - bleak
      pip_check: false
  - requirements:
      run:
        - pip
    script:
      - if: not win
        then: pip check

about:
  summary: Bluetooth Low Energy platform Agnostic Klient
  license: MIT
  license_file:
    - LICENSE
  homepage: https://github.com/hbldh/bleak

extra:
  recipe-maintainers:
    - carlodri
    - jan-janssen
